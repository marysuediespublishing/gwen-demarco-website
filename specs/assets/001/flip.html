<!doctype html><meta charset="utf-8"><title>Ward Breaker landing — flip-through</title>
<style>body{margin:0;background:#111;color:#ddd;font:14px system-ui}header{position:sticky;top:0;background:#000;padding:8px 12px}img{display:block;max-width:100%;margin:0 auto}</style>
<header><b id="n"></b> — ← / → to flip (lo-fi, then hi-fi, then the walk)</header><img id="i">
<script>const F=["01-lofi-1280.png", "01-lofi-390.png", "02-hifi-1280.png", "02-hifi-390.png", "03-walk-00-open.png", "03-walk-01-ward-breaker-ku.png", "03-walk-02-ward-breaker-buy.png", "03-walk-03-ward-breaker-paperback.png", "03-walk-04-series-start-ku.png", "03-walk-05-series-start-buy.png", "03-walk-06-series-start-paperback.png", "03-walk-07-sophie-ku.png", "03-walk-08-sophie-buy.png", "03-walk-09-sophie-paperback.png"];let k=0;const show=()=>{i.src=F[k];n.textContent=(k+1)+'/'+F.length+'  '+F[k];scrollTo(0,0)};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')k=Math.min(k+1,F.length-1);if(e.key==='ArrowLeft')k=Math.max(k-1,0);show()});show();</script>
